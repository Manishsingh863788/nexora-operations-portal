services:
  # ─── Backend API (Node + Express + SQLite) ────────────────────────────────
  - type: web
    name: nexora-backend
    runtime: node
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: npm install && DATABASE_URL="file:/data/nexora.db" npx prisma generate && npm run build
    startCommand: DATABASE_URL="file:/data/nexora.db" npx prisma db push && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        value: file:/data/nexora.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: FRONTEND_URL
        value: https://nexora-operations-portal.vercel.app
      - key: PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING
        value: "1"
    disk:
      name: nexora-sqlite-data
      mountPath: /data
      sizeGB: 1
